<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15 Anos Mariany</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    /* CONTAINER */
    .cinema {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
    }

    video {
      width: 100vw;
      height: 100dvh;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.05); /* leve zoom inicial */
      transition: opacity 1.5s ease, transform 6s ease;
    }

    video.playing {
      opacity: 1;
      transform: scale(1); /* zoom suave entrando */
    }

    /* BARRAS CINEMA */
    .barra {
      position: fixed;
      left: 0;
      width: 100%;
      height: 12vh;
      background: black;
      z-index: 5;
      transition: height 1.2s ease;
    }

    .top { top: 0; }
    .bottom { bottom: 0; }

    /* BOTÃO */
    #botao {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #botao img {
      width: 200px;
    }

    #botao.hidden {
      opacity: 0;
      transform: translate(-50%, -40%);
      pointer-events: none;
    }

    /* TEXTO GIRAR */
    #gire {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      z-index: 10;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }

  </style>
</head>
<body>

  <div class="cinema">
    <video id="video" playsinline>
      <source src="video.mp4" type="video/mp4">
    </video>
  </div>

  <!-- BARRAS -->
  <div class="barra top"></div>
  <div class="barra bottom"></div>

  <!-- BOTÃO -->
  <div id="botao">
    <img src="cliqueaqui.png" alt="Clique aqui">
  </div>

  <!-- DICA -->
  <div id="gire">🔄 Para melhor experiência, use o celular na horizontal</div>

  <script>
    const video = document.getElementById("video");
    const botao = document.getElementById("botao");

    botao.addEventListener("click", async () => {
      video.muted = false;

      const el = document.documentElement;

      // FULLSCREEN (tipo F11)
      if (el.requestFullscreen) {
        await el.requestFullscreen();
      }

      // FORÇAR PAISAGEM (Chrome Android)
      if (screen.orientation && screen.orientation.lock) {
        try {
          await screen.orientation.lock("landscape");
        } catch (err) {
          console.log("Orientação não suportada:", err);
        }
      }

      // PLAY
      video.play();

      // ANIMAÇÕES
      botao.classList.add("hidden");
      video.classList.add("playing");

      document.querySelector(".top").style.height = "8vh";
      document.querySelector(".bottom").style.height = "8vh";

      // Remove dica
      const gire = document.getElementById("gire");
      gire.style.opacity = "0";
    });
  </script>

</body>
</html>
